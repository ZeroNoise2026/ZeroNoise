[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "zeronoise-marketdata"
version = "0.1.0"
description = "Clients for Finnhub, FMP and SEC EDGAR"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31.0",
    "finnhub-python>=2.4.0",
]

[tool.setuptools]
packages = ["marketdata"]
