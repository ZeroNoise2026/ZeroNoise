[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "zeronoise-common"
version = "0.1.0"
description = "Shared infrastructure: Claude client, Supabase client, audit log"
requires-python = ">=3.10"
dependencies = [
    "anthropic>=2.1.0",
    "supabase",
]

[tool.setuptools]
packages = ["common"]
