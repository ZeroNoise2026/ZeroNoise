name: Daily Briefings

# Hourly: each user gets a briefing when their local time is 08:00–08:14.
# Needs repo secrets SUPABASE_URL, SUPABASE_KEY, ANTHROPIC_API_KEY.

on:
  # schedule:
  #   - cron: '0 * * * *'   # every hour (uncomment once the secrets are set)
  workflow_dispatch:

env:
  SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
  SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
  ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

jobs:
  briefing:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/jobs
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: apps/jobs/requirements.txt

      - name: Install dependencies
        run: pip install ../../libs/common ../../libs/research -r requirements.txt

      - name: Generate due briefings
        run: python -m briefing
