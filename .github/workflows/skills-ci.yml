name: Skills CI

on:
  push:
    branches: [main]
    paths: ['libs/skills/**', 'apps/summarization/**', '.github/workflows/skills-ci.yml']
  pull_request:
    paths: ['libs/skills/**', 'apps/summarization/**', '.github/workflows/skills-ci.yml']
  workflow_dispatch:

jobs:
  import-guard:
    # ubuntu-latest has a CASE-SENSITIVE filesystem. macOS silently tolerates
    # an import resolving to a differently-cased directory; Linux, Docker and
    # Cloud Run do not. This job is where that class of bug surfaces.
    runs-on: ubuntu-latest

    steps:
      # The smoke suite reaches into apps/summarization to exercise the CLI
      # arg parser, so it needs the whole monorepo checkout.
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Installing the package is also how the backend image gets it
      # (see apps/backend/Dockerfile), so this validates that path.
      - name: Install skills package
        run: pip install -e ./libs/skills

      - name: Import guard
        run: |
          python - <<'PY'
          import skills
          from skills.router import _build_system_prompt

          names = skills.list_skills()
          print("registered skills:", names)

          missing = {"generate_report", "compare_tickers"} - set(names)
          assert not missing, f"registry failed to discover: {sorted(missing)}"
          assert _build_system_prompt().strip(), "router system prompt is empty"
          print("OK: `import skills` resolves and the registry is populated")
          PY

      - name: Offline smoke suite
        working-directory: libs/skills
        run: python -m skills.tests.test_smoke
